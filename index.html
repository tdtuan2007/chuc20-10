<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chúc Mừng 20/10 - Mở Phong Thư Yêu Thương</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-color: #fff6f8;
      --primary: #d84b78;
      --primary-light: #f7a8c0;
      --envelope-body: #f9cbd8;
      --envelope-flap: #f2aec2;
      --envelope-pocket: #f5b9cb;
      --text-dark: #4a2533;
      --text-muted: #7e5262;
      --card-bg: rgba(255, 255, 255, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 15% 20%, #ffe3ec 0%, #fff6f8 50%, #fce8ef 100%);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #effect-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    .ambient-glow {
      position: fixed;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      filter: blur(85px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.55;
    }

    .glow-1 {
      top: -100px;
      left: -100px;
      background: #ffbfd3;
    }

    .glow-2 {
      bottom: -100px;
      right: -100px;
      background: #ffd1df;
    }

    .container {
      max-width: 1140px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px;
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(216, 75, 120, 0.15);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--primary);
    }

    main {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 40px;
      align-items: center;
      margin: 30px 0;
    }

    @media (max-width: 880px) {
      main {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 45px;
      }
    }

    .intro-section .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(216, 75, 120, 0.12);
      color: var(--primary);
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .intro-section h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 5vw, 4.2rem);
      line-height: 1.1;
      margin-bottom: 18px;
      color: var(--text-dark);
    }

    .intro-section h1 em {
      color: var(--primary);
      font-style: italic;
    }

    .intro-section p {
      font-size: 1.03rem;
      line-height: 1.75;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .intro-section .highlight-recipient {
      font-weight: 600;
      color: var(--text-dark);
      font-size: 1.15rem;
    }

    .hint-box {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: white;
      border: 1px solid rgba(216, 75, 120, 0.25);
      border-radius: 12px;
      font-size: 0.88rem;
      color: var(--primary);
      box-shadow: 0 8px 20px rgba(216, 75, 120, 0.08);
    }

    .stage-section {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 460px;
    }

    /* Phong thư 3D */
    .envelope-wrapper {
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .envelope-wrapper.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85) translateY(30px);
      position: absolute;
    }

    .envelope {
      position: relative;
      width: 320px;
      height: 210px;
      background: var(--envelope-body);
      border-radius: 0 0 14px 14px;
      box-shadow: 0 22px 45px rgba(180, 50, 95, 0.22);
      perspective: 900px;
      animation: floatEnvelope 3.2s ease-in-out infinite;
    }

    @keyframes floatEnvelope {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .letter-preview {
      position: absolute;
      bottom: 12px;
      left: 16px;
      right: 16px;
      height: 175px;
      background: #fff;
      border-radius: 10px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
      z-index: 2;
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid #ffe4ed;
    }

    .letter-preview span {
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .letter-preview small {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .envelope-pocket {
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: 0 0 14px 14px;
      overflow: hidden;
      pointer-events: none;
    }

    .envelope-pocket::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid var(--envelope-pocket);
      border-right: 160px solid var(--envelope-pocket);
      border-top: 105px solid transparent;
      border-bottom: 105px solid #eea4bb;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-top: 120px solid var(--envelope-flap);
      transform-origin: top;
      transition: transform 0.55s ease;
      z-index: 4;
      filter: drop-shadow(0 4px 6px rgba(150, 40, 80, 0.12));
    }

    .wax-seal {
      position: absolute;
      top: 105px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 54px;
      background: radial-gradient(circle at 30% 30%, #e65c87, #b32653);
      border-radius: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.4rem;
      box-shadow: 0 6px 16px rgba(160, 20, 65, 0.35), inset 0 0 8px rgba(255, 255, 255, 0.4);
      border: 2px dashed rgba(255, 220, 230, 0.6);
      transition: transform 0.4s ease, opacity 0.4s ease;
      animation: sealPulse 2s infinite;
    }

    @keyframes sealPulse {

      0%,
      100% {
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        transform: translate(-50%, -50%) scale(1.08);
      }
    }

    .envelope.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope.open .wax-seal {
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }

    .envelope.open .letter-preview {
      transform: translateY(-100px);
    }

    .click-to-open-text {
      margin-top: 24px;
      font-weight: 600;
      color: var(--primary);
      font-size: 0.95rem;
    }

    /* Thiệp mở ra */
    .opened-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 28px;
      padding: 24px 22px;
      box-shadow: 0 24px 60px rgba(180, 60, 100, 0.16);
      max-width: 530px;
      width: 100%;
      display: none;
      opacity: 0;
      transform: translateY(25px) scale(0.95);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }

    .opened-card.active {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .close-letter-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(216, 75, 120, 0.1);
      color: var(--primary);
      border: none;
      border-radius: 99px;
      padding: 5px 12px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      z-index: 10;
    }

    /* Dải phim trôi tự động */
    .gallery-filmstrip {
      overflow: hidden;
      width: 100%;
      padding: 10px 0 16px;
      position: relative;
      mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    }

    .film-track {
      display: flex;
      gap: 14px;
      width: max-content;
      animation: scrollFilm 24s linear infinite;
    }

    .film-track:hover {
      animation-play-state: paused;
    }

    @keyframes scrollFilm {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .film-item {
      width: 170px;
      background: #fff;
      padding: 6px 6px 12px 6px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(120, 40, 70, 0.12);
      border: 1px solid #f5dce4;
      cursor: pointer;
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    .film-item:hover {
      transform: scale(1.05) translateY(-3px);
    }

    .film-item img {
      width: 100%;
      height: 125px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }

    .film-item p {
      font-family: 'Dancing Script', cursive;
      font-size: 0.95rem;
      text-align: center;
      margin-top: 6px;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .film-hint {
      text-align: center;
      font-size: 0.76rem;
      color: var(--primary);
      margin-bottom: 12px;
      font-weight: 500;
    }

    /* Nội dung lời chúc */
    .letter-content {
      text-align: center;
      padding-top: 8px;
      border-top: 1px solid rgba(216, 75, 120, 0.12);
    }

    .letter-content h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.75rem;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .typewriter-text {
      font-size: 0.94rem;
      line-height: 1.65;
      color: var(--text-muted);
      min-height: 68px;
      margin-bottom: 12px;
    }

    .card-signature {
      font-family: 'Dancing Script', cursive;
      font-size: 1.35rem;
      color: var(--primary);
      padding-top: 8px;
      border-top: 1px dashed rgba(216, 75, 120, 0.25);
    }

    /* Lightbox phóng to ảnh */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(45, 15, 25, 0.85);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 75vh;
      border-radius: 14px;
      border: 6px solid #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .lightbox-caption {
      margin-top: 14px;
      color: #fff;
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      text-align: center;
    }

    .music-toggle {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 150;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #ff8da8);
      color: #fff;
      border: 3px solid #fff;
      box-shadow: 0 8px 20px rgba(216, 75, 120, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .music-toggle.playing {
      animation: spinVinyl 4s linear infinite;
    }

    @keyframes spinVinyl {
      100% {
        transform: rotate(360deg);
      }
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      padding-top: 16px;
      border-top: 1px solid rgba(216, 75, 120, 0.15);
    }
  </style>
</head>

<body>

  <canvas id="effect-canvas" aria-hidden="true"></canvas>
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>

  <div class="container">
    <header>
      <div><span>✿</span> Một chút yêu thương</div>
      <div>20 THÁNG 10</div>
    </header>

    <main>
      <section class="intro-section">
        <div class="badge">Ngày Phụ nữ Việt Nam</div>
        <h1>Chúc mừng <em>20 / 10</em></h1>
        <p class="highlight-recipient" id="ui-recipient"></p>
        <p id="ui-intro-paragraph"></p>
        <div class="hint-box">
          💌 Bấm vào phong thư bên cạnh để mở thư
        </div>
      </section>

      <section class="stage-section">
        <!-- Phong thư đóng -->
        <div class="envelope-wrapper" id="envelope-wrapper" onclick="openEnvelope(event)">
          <div class="envelope" id="envelope">
            <div class="envelope-flap"></div>
            <div class="letter-preview">
              <span id="ui-envelope-title"></span>
              <small>Chạm để mở bức thư này nhé ❀</small>
            </div>
            <div class="envelope-pocket"></div>
            <div class="wax-seal">♥</div>
          </div>
          <div class="click-to-open-text">
            ✨ Chạm vào con dấu để mở phong thư ✨
          </div>
        </div>

        <!-- Thiệp mở ra -->
        <article class="opened-card" id="opened-card">
          <button class="close-letter-btn" onclick="closeEnvelope(event)">Đóng thư ✕</button>

          <!-- Dải phim trôi tự động -->
          <div class="gallery-filmstrip">
            <div class="film-track" id="film-track"></div>
          </div>
          <div class="film-hint">✨ Rê chuột vào ảnh để dừng lại - Bấm vào ảnh để phóng to ✨</div>

          <div class="letter-content">
            <h2 id="ui-letter-title"></h2>
            <p class="typewriter-text" id="typewriter-text"></p>
            <div class="card-signature" id="ui-signature"></div>
          </div>
        </article>
      </section>
    </main>

    <footer>ĐƯỢC GỬI BẰNG TẤT CẢ YÊU THƯƠNG • 20 / 10</footer>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Ảnh phóng to" />
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <button class="music-toggle" id="music-btn" onclick="toggleMusic(event)" title="Bật / Tắt nhạc">
    🎵
  </button>

  <audio id="bg-music" loop preload="auto"></audio>

  <script>
    // =========================================================================
    // ★ KHU VỰC CHỈNH SỬA NHẠC, CHỮ VÀ DANH SÁCH ẢNH ★
    // =========================================================================
    const CONFIG = {
      musicUrl: "nhac.mp3",

      recipient: "Gửi công chúa của anh.",
      introParagraph: "Cảm ơn em vì đã đến và mang lại cho thế giới của anh biết bao sắc màu hạnh phúc. Món quà nhỏ này anh chuẩn bị riêng dành tặng cho em.",
      envelopeTitle: "Gửi tình yêu của anh",
      letterTitle: "Gửi em, người con gái anh yêu 💐",
      wishMessage: "Nhân ngày 20/10, anh muốn gửi đến em những lời chúc tốt đẹp và ngọt ngào nhất. Cảm ơn em vì đã bước vào thế giới của anh, mang theo ánh sáng, sự ấm áp và muôn vàn tiếng cười. Mỗi ngày được nhìn thấy nụ cười và ở bên cạnh em là điều hạnh phúc nhất cuộc đời anh. Chúc công chúa của anh luôn xinh đẹp rạng rỡ, mãi giữ được sự hồn nhiên, đáng yêu này và luôn tin rằng anh sẽ luôn ở đây, đồng hành cùng em trên mọi chặng đường tương lai. Anh yêu em rất nhiều! 💖",
      signature: "♥ Từ người yêu của em ♥",

      photos: [
        {
          url: "https://lh3.googleusercontent.com/d/1FFzvfHPWPwiTF2cnZuAix6E0j4A1bmF0",
          caption: "Luôn rạng rỡ như những đóa hoa 🌸"
        },
        {
          url: "https://lh3.googleusercontent.com/d/1j0XVg9osDk57wGdA9iXIKAWcf_vWIHnt",
          caption: "Mỗi khoảnh khắc bên em đều là tuyệt nhất 🌸"
        },
        {
          url: "https://lh3.googleusercontent.com/d/1Es0vW3sERFGLQ8g23PgQjrPnD9RLfUYL",
          caption: "Luôn tự tin và ngập tràn tiếng cười 💖"
        },
        {
          url: "https://lh3.googleusercontent.com/d/1k7eI71Lm6QjxykIxHkAJ3qUig0meticT",
          caption: "Nụ cười của em là điều anh trân quý nhất ✨"
        },
        {
          url: "https://lh3.googleusercontent.com/d/1e99kJIpR-1102YHZeaoTmikzjogc2y_x",
          caption: "Mãi bên nhau em nhé 💖"
        },
        {
          url: "https://lh3.googleusercontent.com/d/1YJJuJ_2WzbiwFs8n_UEyou8HgvDuvFSN",
          caption: "Bình yên của anh là đây 🌸"
        },
        {
          url: "https://lh3.googleusercontent.com/d/1ih_Rzs7mbZJT_R-dC7Jxag5W88jRNolf",
          caption: "Nụ cười đẹp nhất ✨"
        },
        {
          url: "https://lh3.googleusercontent.com/d/1Y14rlCksf103NORFBNMeT3Bu_0ccqT7-",
          caption: "Hạnh phúc mỗi ngày 💖"
        },
        {
          url: "https://lh3.googleusercontent.com/d/1MLjGhy9lyjuktoFt2UtCf_oK4ZV2wXqn",
          caption: "Thế giới của anh 🌷"
        },
        {
          url: "https://lh3.googleusercontent.com/d/1Wtf0Bb9n7HSo5RFRaAHQ5Jw9aAOizoFs",
          caption: "Mãi bên nhau nhé 💐"
        }
      ]
    };

    // Gắn dữ liệu từ CONFIG
    document.getElementById('ui-recipient').textContent = CONFIG.recipient;
    document.getElementById('ui-intro-paragraph').textContent = CONFIG.introParagraph;
    document.getElementById('ui-envelope-title').textContent = CONFIG.envelopeTitle;
    document.getElementById('ui-letter-title').textContent = CONFIG.letterTitle;
    document.getElementById('ui-signature').textContent = CONFIG.signature;

    const audio = document.getElementById('bg-music');
    audio.src = CONFIG.musicUrl;

    // Khởi tạo dải phim (Nhân đôi danh sách để cuộn vô tận mượt mà)
    const filmTrack = document.getElementById('film-track');
    function renderFilmstrip() {
      const doubled = [...CONFIG.photos, ...CONFIG.photos];
      filmTrack.innerHTML = doubled.map(item => `
        <div class="film-item" onclick="openLightbox('${item.url}', '${item.caption.replace(/'/g, "\\'")}')">
          <img src="${item.url}" alt="${item.caption}" />
          <p>${item.caption}</p>
        </div>
      `).join('');
    }
    renderFilmstrip();

    let typingInterval = null;
    const envelope = document.getElementById('envelope');
    const envelopeWrapper = document.getElementById('envelope-wrapper');
    const openedCard = document.getElementById('opened-card');
    const typewriterEl = document.getElementById('typewriter-text');

    function startTypewriter(text) {
      clearInterval(typingInterval);
      typewriterEl.textContent = "";
      let i = 0;
      typingInterval = setInterval(() => {
        if (i < text.length) {
          typewriterEl.textContent += text.charAt(i);
          i++;
        } else {
          clearInterval(typingInterval);
        }
      }, 30);
    }

    function openEnvelope(e) {
      e.stopPropagation();
      if (envelope.classList.contains('open')) return;

      envelope.classList.add('open');
      playMusicIfNeeded();

      const rect = envelope.getBoundingClientRect();
      createBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 36);

      setTimeout(() => {
        envelopeWrapper.classList.add('hidden');
        openedCard.classList.add('active');
        startTypewriter(CONFIG.wishMessage);
      }, 900);
    }

    function closeEnvelope(e) {
      e.stopPropagation();
      openedCard.classList.remove('active');
      setTimeout(() => {
        envelope.classList.remove('open');
        envelopeWrapper.classList.remove('hidden');
      }, 300);
    }

    function openLightbox(url, caption) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox-caption').textContent = caption || '';
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    const musicBtn = document.getElementById('music-btn');
    let musicPlaying = false;

    function playMusicIfNeeded() {
      if (!musicPlaying) {
        audio.play().then(() => {
          musicPlaying = true;
          musicBtn.classList.add('playing');
        }).catch(() => { });
      }
    }

    function toggleMusic(e) {
      e.stopPropagation();
      if (musicPlaying) {
        audio.pause();
        musicPlaying = false;
        musicBtn.classList.remove('playing');
      } else {
        audio.play().then(() => {
          musicPlaying = true;
          musicBtn.classList.add('playing');
        }).catch(() => { });
      }
    }

    // Hiệu ứng Canvas (hoa rơi & pháo hoa)
    const canvas = document.getElementById('effect-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const symbols = ['♥', '✿', '❀', '✧', '✦', '🌸', '💖'];
    const colors = ['#e84a7f', '#ff7aa2', '#ffb3c6', '#f4a261', '#d84b78'];

    const particles = [];
    const fallingPetals = [];

    for (let i = 0; i < 24; i++) {
      fallingPetals.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 14 + 10,
        speedY: Math.random() * 0.9 + 0.4,
        speedX: Math.random() * 0.8 - 0.4,
        symbol: symbols[Math.floor(Math.random() * symbols.length)],
        color: colors[Math.floor(Math.random() * colors.length)],
        opacity: Math.random() * 0.35 + 0.2
      });
    }

    function createBurst(x, y, count = 20) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.5 - 0.25);
        const speed = Math.random() * 5.5 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          gravity: 0.08,
          size: Math.random() * 18 + 12,
          symbol: symbols[Math.floor(Math.random() * symbols.length)],
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.015 + 0.01
        });
      }
    }

    let lastTrailTime = 0;
    window.addEventListener('pointermove', (e) => {
      const now = Date.now();
      if (now - lastTrailTime > 45) {
        particles.push({
          x: e.clientX,
          y: e.clientY,
          vx: (Math.random() - 0.5) * 1.2,
          vy: (Math.random() - 0.5) * 1.2 - 0.5,
          gravity: 0.02,
          size: Math.random() * 10 + 8,
          symbol: '✦',
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 0.85,
          decay: 0.03
        });
        lastTrailTime = now;
      }
    });

    window.addEventListener('pointerdown', (e) => {
      createBurst(e.clientX, e.clientY, 18);
      playMusicIfNeeded();
    });

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      fallingPetals.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX + Math.sin(p.y * 0.01) * 0.3;
        if (p.y > canvas.height) {
          p.y = -20;
          p.x = Math.random() * canvas.width;
        }
        ctx.save();
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = p.color;
        ctx.font = `${p.size}px sans-serif`;
        ctx.fillText(p.symbol, p.x, p.y);
        ctx.restore();
      });

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.font = `${p.size}px sans-serif`;
        ctx.fillText(p.symbol, p.x, p.y);
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>

</html>
